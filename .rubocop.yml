AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  SuggestExtensions: false
  Exclude:
    - "pkg/**/*"
    - "bin/**/*"

Metrics/ClassLength:
  Max: 100

Metrics/ModuleLength:
  Max: 100

Metrics/MethodLength:
  Max: 5
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Naming/PredicateMethod:
  AllowedMethods:
    - call
    - run

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: false

Metrics/AbcSize:
  Max: 15

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# exe/elelem runs with -W0, which silences Kernel#warn.
Style/StderrPuts:
  Enabled: false

Style/GlobalVars:
  Exclude:
    - "spec/**/*"

Lint/EmptyBlock:
  Exclude:
    - "spec/**/*"

Lint/UselessDefaultValueArgument:
  Enabled: false

Lint/RedundantRequireStatement:
  Enabled: false

Lint/UnusedBlockArgument:
  IgnoreEmptyBlocks: true
  AllowUnusedKeywordArguments: true

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Moved from elelem-builtins, which did not enforce size metrics.
Metrics:
  Exclude:
    - "lib/elelem/builtins.rb"
    - "lib/elelem/builtins/**/*"
    - "lib/elelem/plugins/**/*"
