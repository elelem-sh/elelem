name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bin/cibuild
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec
      - run: gem build elelem.gemspec && gem install --no-document --local elelem-*.gem
        shell: bash
      - run: elelem --help && elelem ask -p demo "echo ok"
        shell: bash
      - run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\(usr\\|ucrt64\\)?bin|\\msys|\\mingw' }) -join ';'
          $shell = ruby -e 'require "elelem"; print Elelem::Builtins.shell'
          if ($shell -ne 'bash') { throw "expected bash, got $shell" }
          $out = elelem ask -p demo "echo ok && echo two" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "ask failed" }
          if ($out -notmatch 'two') { throw "did not run both commands" }
        shell: pwsh
      - run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\|\\msys|\\mingw' }) -join ';'
          $shell = ruby -e 'require "elelem"; print Elelem::Builtins.shell'
          if ($shell -ne 'cmd') { throw "expected cmd, got $shell" }
          $out = elelem ask -p demo "echo ok && echo two" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "ask failed" }
          if ($out -notmatch 'two') { throw "did not run both commands" }
        shell: pwsh
  release-please:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          await-release: false
